name: Update Subscription Files Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # 2. 下载所有订阅内容
      - name: Download subscription files
        run: |
          echo "Starting download of all subscription files..."
          
          # 下载 Clash 格式
          curl -Ls "https://www.6-9f8.workers.dev/e258977b-e413-4718-a3af-02d75492c349/sub?target=clash" -o clash-stash.txt
          echo "✓ clash-stash.txt downloaded"
          
          # 下载 Surge 格式
          curl -Ls "https://www.6-9f8.workers.dev/e258977b-e413-4718-a3af-02d75492c349/sub?target=surge" -o surge.txt
          echo "✓ surge.txt downloaded"
          
          # 下载 Sing-box 格式
          curl -Ls "https://www.6-9f8.workers.dev/e258977b-e413-4718-a3af-02d75492c349/sub?target=singbox" -o singbox.txt
          echo "✓ singbox.txt downloaded"
          
          # 下载 Loon 格式
          curl -Ls "https://www.6-9f8.workers.dev/e258977b-e413-4718-a3af-02d75492c349/sub?target=loon" -o loon.txt
          echo "✓ loon.txt downloaded"
          
          # 下载 Quantumult X 格式
          curl -Ls "https://www.6-9f8.workers.dev/e258977b-e413-4718-a3af-02d75492c349/sub?target=quanx" -o quanx.txt
          echo "✓ quanx.txt downloaded"
          
          echo "All files downloaded successfully!"

      # 3. 配置Git用户信息
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 提交并推送所有更改
      - name: Commit and push changes
        run: |
          # 添加所有5个文件到暂存区
          git add cf-b64.txt clash-stash.txt surge.txt singbox.txt loon.txt quanx.txt
          
          # 检查暂存区是否有变化
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: Hourly subscription files update [skip ci]"
            git push
            echo "✅ All subscription files updated and pushed successfully."
          else
            echo "ℹ️ No changes detected in any subscription files. Nothing to commit."
          fi
